name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HODD_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Validate version and changelog
        run: |
          python3 scripts/release_metadata.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Restore persistent signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HODD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HODD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HODD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HODD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo 'Signing is not configured. Test APKs only; do not distribute them.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            KEY_ALIAS=hodd-ci-test
            STORE_PASSWORD=ci-test-only
            KEY_PASSWORD=ci-test-only
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/hodd-signing.jks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=Hodd CI Test Only'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hodd-signing.jks"
          fi
          echo "HODD_KEYSTORE_PATH=$RUNNER_TEMP/hodd-signing.jks" >> "$GITHUB_ENV"
          echo "HODD_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HODD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "HODD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: ./gradlew --build-cache --parallel :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Build and verify signed APK
        run: |
          ./gradlew --build-cache :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/hodd-signature.txt"
          if [ "${{ steps.signing.outputs.ready }}" = 'true' ]; then
            expected=$(openssl x509 -in docs/signing-certificate.pem -outform DER | sha256sum | cut -d ' ' -f 1)
            grep -F "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/hodd-signature.txt"
          fi
          python3 scripts/release_metadata.py --apk app/build/outputs/apk/release/app-release.apk --build "$HODD_VERSION_CODE" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: hodd-mobile-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: hodd-mobile-install
          path: dist/*
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hodd-signing.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html

  device-tests:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      # Device tests install the APKs built above; they never invoke Gradle.
      - uses: actions/download-artifact@v4
        with:
          name: hodd-mobile-test-apks
          path: built-apks
      - name: Cache Android emulator AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/avd
          key: avd-${{ runner.os }}-api35-pixel5-v1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          avd-name: hodd-ci-api35
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            adb install -r built-apks/debug/app-debug.apk
            adb install -r built-apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e timeout_msec 120000 no.vardir.hodd.test/no.vardir.hodd.HoddTestRunner | tee device-tests.txt; adb pull /sdcard/Android/data/no.vardir.hodd/files/screenshots screenshots || true; grep -q '^OK (41 tests)' device-tests.txt
            bash scripts/check-apk-update.sh built-apks/debug/app-debug.apk built-apks/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            screenshots/
            device-tests.txt
